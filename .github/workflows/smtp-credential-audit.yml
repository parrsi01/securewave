name: SMTP Credential Source Audit

on:
  push:
    branches: [codex/smtp-credential-source-audit]
    paths:
      - .github/workflows/smtp-credential-audit.yml
      - scripts/audit_production_smtp.py

permissions:
  contents: read

concurrency:
  group: securewave-smtp-credential-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'parrsi01/securewave' && github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Compare and authenticate protected SMTP inputs without sending mail
        env:
          SSH_KEY: ${{ secrets.SECUREWAVE_PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SECUREWAVE_PRODUCTION_KNOWN_HOSTS }}
          SECUREWAVE_PRODUCTION_HOST: ${{ vars.SECUREWAVE_PRODUCTION_HOST }}
          SECUREWAVE_PRODUCTION_USER: ${{ vars.SECUREWAVE_PRODUCTION_USER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          export SECUREWAVE_PRODUCTION_SSH_KEY_FILE="$RUNNER_TEMP/smtp_audit_key"
          export SECUREWAVE_PRODUCTION_KNOWN_HOSTS_FILE="$RUNNER_TEMP/smtp_audit_known_hosts"
          trap 'rm -f "$SECUREWAVE_PRODUCTION_SSH_KEY_FILE" "$SECUREWAVE_PRODUCTION_KNOWN_HOSTS_FILE"' EXIT
          printf '%s\n' "$SSH_KEY" > "$SECUREWAVE_PRODUCTION_SSH_KEY_FILE"
          printf '%s\n' "$KNOWN_HOSTS" > "$SECUREWAVE_PRODUCTION_KNOWN_HOSTS_FILE"
          unset SSH_KEY KNOWN_HOSTS
          python3 scripts/audit_production_smtp.py
