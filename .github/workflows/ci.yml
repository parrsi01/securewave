name: Review checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securewave_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: securewave_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: make test-backend
        env:
          SECUREWAVE_TEST_DATABASE_URL: postgresql://securewave_test:disposable-ci-only@127.0.0.1:5432/securewave_test

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: make test-flutter
      - run: make test-native

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-docs.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: make check
      - run: make docs

  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 website/tests/check_design_contract.py
      - run: node website/tests/check_download_selector.cjs
      - run: node website/tests/check_support_widget.cjs
      - run: node website/tests/check_account_navigation.cjs

  routing-research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ml.txt
      - run: pip install -r requirements-dev.txt -r requirements-ml.txt
      - run: python -m pytest --confcutdir=tests -q tests/test_routing_training.py tests/test_routing_shadow.py tests/test_routing_worker.py tests/test_routing_collection.py tests/test_routing_integration.py
      - run: python -m ml.train_routing --output "$RUNNER_TEMP/routing-artifacts" --seed 42 --episodes 80
