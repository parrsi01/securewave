name: deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm_destroy:
        description: "Required only for destroy: type YES"
        required: false
        default: ""
        type: string

concurrency:
  group: securewave-hetzner-deploy
  cancel-in-progress: false

jobs:
  hetzner-safe-deploy:
    runs-on: ubuntu-latest
    env:
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      CONFIRM_DESTROY: ${{ github.event.inputs.confirm_destroy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate deploy prerequisites
        run: |
          if [[ -z "${HETZNER_API_TOKEN}" ]]; then
            echo "HETZNER_API_TOKEN secret is required."
            exit 1
          fi
          if [[ "${{ github.event.inputs.action }}" == "destroy" && "${CONFIRM_DESTROY}" != "YES" ]]; then
            echo "Destroy requires confirm_destroy=YES."
            exit 1
          fi

      - name: Execute Hetzner release workflow
        run: |
          if [[ "${{ github.event.inputs.action }}" == "destroy" ]]; then
            ALLOW_DESTROY=true bash scripts/release_hetzner.sh destroy
          elif [[ "${{ github.event.inputs.action }}" == "apply" ]]; then
            bash scripts/release_hetzner.sh apply
          else
            bash scripts/release_hetzner.sh plan
          fi
