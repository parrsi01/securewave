name: Apple Release Validation

on:
  workflow_dispatch:
    inputs:
      require_signing:
        description: "Fail when Apple signing secrets are missing"
        required: false
        type: boolean
        default: false
      publish_macos_demo:
        description: "Commit the generated macOS UI demo zip back to this branch"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: apple-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable

jobs:
  ios-unsigned:
    name: iOS No-Codesign Build
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Configure Flutter for CocoaPods project
        run: flutter config --no-enable-swift-package-manager

      - name: Install Apple build prerequisites
        run: |
          set -euo pipefail
          if ! command -v go >/dev/null 2>&1; then
            brew install go
          fi
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi

      - name: Fetch Flutter dependencies
        run: |
          FORCE_FLUTTER_ENV=true bash scripts/prepare_flutter_env.sh
          cd securewave_app
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd securewave_app/ios
          pod install

      - name: Verify iOS workspace and store metadata
        run: |
          bash securewave_app/ios/scripts/ensure_workspace.sh
          bash securewave_app/scripts/verify_ios_build.sh
          bash scripts/verify_ios_store_compliance.sh

      - name: Check signing secret readiness
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_signing }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_SIGNING_CERTIFICATE_P12: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY \
            IOS_SIGNING_CERTIFICATE_P12 \
            IOS_SIGNING_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required signing secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Apple signing assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_signing }}
        env:
          IOS_SIGNING_CERTIFICATE_P12: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" securewave-release.keychain-db
          security set-keychain-settings -lut 21600 securewave-release.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" securewave-release.keychain-db

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path("signing-certificate.p12").write_bytes(
              base64.b64decode(os.environ["IOS_SIGNING_CERTIFICATE_P12"])
          )
          PY
          security import signing-certificate.p12 \
            -k securewave-release.keychain-db \
            -P "$IOS_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychain -d user -s securewave-release.keychain-db login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" securewave-release.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          profile_path = Path.home() / "Library/MobileDevice/Provisioning Profiles/securewave.mobileprovision"
          profile_path.write_bytes(base64.b64decode(os.environ["IOS_PROVISIONING_PROFILE"]))
          PY
          rm -f signing-certificate.p12

      - name: Build unsigned iOS release
        run: |
          cd securewave_app
          flutter build ios --release --no-codesign

      - name: Collect unsigned iOS app artifact
        run: |
          set -euo pipefail
          mkdir -p apple-artifacts/ios-unsigned
          app_path="$(find securewave_app/build/ios -type d -name '*.app' | sort | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "No unsigned iOS .app found under securewave_app/build/ios" >&2
            find securewave_app/build/ios -maxdepth 5 -type d -print >&2 || true
            exit 1
          fi
          ditto -c -k --keepParent "$app_path" apple-artifacts/ios-unsigned/securewave-ios-unsigned.zip

      - name: Build signed iOS archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_signing }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash securewave_app/scripts/archive_ios_release.sh

      - name: Upload unsigned iOS app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securewave-ios-unsigned-${{ github.ref_name }}
          path: apple-artifacts/ios-unsigned/securewave-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed iOS export artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securewave-ios-signed-export-${{ github.ref_name }}
          path: securewave_app/build/ios/export/
          if-no-files-found: error
          retention-days: 14

  macos-ui-demo:
    name: macOS UI Demo Package
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Configure Flutter for CocoaPods project
        run: flutter config --no-enable-swift-package-manager

      - name: Install Apple build prerequisites
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi

      - name: Build macOS UI demo package
        run: bash securewave_app/scripts/package_macos_ui_demo.sh

      - name: Upload macOS UI demo package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securewave-macos-ui-demo-${{ github.ref_name }}
          path: |
            static/downloads/securewave-macos-*-ui-demo.zip
            static/downloads/manifest.json
          if-no-files-found: error
          retention-days: 14

  publish-macos-ui-demo:
    name: Publish macOS UI Demo to Selected Branch
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_macos_demo && github.ref_type == 'branch' }}
    needs: macos-ui-demo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout selected branch without running repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Download reviewed build-job output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: securewave-macos-ui-demo-${{ github.ref_name }}
          path: publish-input

      - name: Validate and publish only the expected files
        run: |
          set -euo pipefail
          demo_zip="$(find publish-input -type f -name 'securewave-macos-*-ui-demo.zip' -print -quit)"
          manifest="$(find publish-input -type f -name manifest.json -print -quit)"
          test -n "$demo_zip"
          test -n "$manifest"
          python3 -m json.tool "$manifest" >/dev/null
          install -m 0644 "$demo_zip" static/downloads/"$(basename "$demo_zip")"
          install -m 0644 "$manifest" static/downloads/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/downloads/securewave-macos-*-ui-demo.zip static/downloads/manifest.json
          if git diff --cached --quiet; then
            echo "No macOS demo package changes to publish."
          else
            git commit -m "Publish macOS UI demo package"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
