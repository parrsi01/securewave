name: Flutter Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FLUTTER_CHANNEL: "stable"

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - name: Install preflight system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev
      - name: Install preflight Python deps
        run: python3 -m pip install --disable-pip-version-check cryptography
      - name: Log preflight runtime
        run: |
          echo "[CI] Python version:" && python3 --version
          echo "[CI] Pip packages:" && pip list
      - name: Verify version sync
        run: bash scripts/verify_version_sync.sh
      - name: Release preflight checks
        # Guard against misconfigured release tags and missing production secrets.
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          AUTH_ENCRYPTION_KEY: ${{ secrets.AUTH_ENCRYPTION_KEY }}
          WG_ENCRYPTION_KEY: ${{ secrets.WG_ENCRYPTION_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_BASIC_MONTHLY: ${{ secrets.STRIPE_PRICE_BASIC_MONTHLY }}
          STRIPE_PRICE_PREMIUM_MONTHLY: ${{ secrets.STRIPE_PRICE_PREMIUM_MONTHLY }}
          STRIPE_PRICE_ULTRA_MONTHLY: ${{ secrets.STRIPE_PRICE_ULTRA_MONTHLY }}
        run: bash scripts/release_preflight.sh

  package-linux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Verify version sync
        run: bash scripts/verify_version_sync.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            ninja-build \
            pkg-config \
            python3-pip \
            wireguard-tools
      - name: Install appimage-builder
        run: |
          python3 -m pip install --user appimage-builder
          echo \"$HOME/.local/bin\" >> $GITHUB_PATH
      - name: Run Linux release smoke checks
        run: |
          bash securewave_app/scripts/run_release_linux_smoke_checks.sh
      - name: Build Linux packages
        run: |
          bash securewave_app/scripts/build_appimage.sh
          bash securewave_app/scripts/build_deb.sh
      - name: Verify Linux package artifact
        run: |
          bash securewave_app/scripts/verify_linux_package_artifact.sh
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-linux-packages
          path: |
            securewave_app/SecureWave-x86_64.AppImage
            securewave_app/build/packaging/*.deb

  build-windows-installer:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Verify version sync
        run: bash scripts/verify_version_sync.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          ./windows_installer/build_windows_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-windows-installer
          path: artifacts/windows_release/securewave-windows-x64-setup.exe

  build-macos:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Verify version sync
        run: bash scripts/verify_version_sync.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Build macOS (unsigned)
        run: |
          bash securewave_app/scripts/build_macos_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-macos
          path: securewave_app/build/macos/Build/Products/Release/

  build-android-aab:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Check Android signing secrets
        id: android_secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "[CI] Android signing secrets absent; skipping Android release build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify version sync
        if: steps.android_secrets.outputs.enabled == 'true'
        run: bash scripts/verify_version_sync.sh
      - uses: subosito/flutter-action@v2
        if: steps.android_secrets.outputs.enabled == 'true'
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Decode keystore
        if: steps.android_secrets.outputs.enabled == 'true'
        run: |
          echo \"${{ secrets.ANDROID_KEYSTORE_BASE64 }}\" | base64 -d > securewave_app/android/app/keystore.jks
      - name: Build Android AAB (release)
        if: steps.android_secrets.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/securewave_app/android/app/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd securewave_app
          flutter pub get
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        if: steps.android_secrets.outputs.enabled == 'true'
        with:
          name: securewave-android-aab
          path: securewave_app/build/app/outputs/bundle/release/*.aab

  build-ios:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Check iOS signing secrets
        id: ios_secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_TEAM_ID}" ]; then
            echo "[CI] Apple signing secrets absent; skipping iOS release build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify version sync
        if: steps.ios_secrets.outputs.enabled == 'true'
        run: bash scripts/verify_version_sync.sh
      - name: Verify iOS store compliance
        if: steps.ios_secrets.outputs.enabled == 'true'
        # Guard against App Store blockers before running Xcode builds.
        run: bash scripts/verify_ios_store_compliance.sh
      - uses: subosito/flutter-action@v2
        if: steps.ios_secrets.outputs.enabled == 'true'
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install CocoaPods
        if: steps.ios_secrets.outputs.enabled == 'true'
        run: |
          cd securewave_app
          flutter pub get
          cd ios && pod install --repo-update
      - name: Verify workspace
        if: steps.ios_secrets.outputs.enabled == 'true'
        run: |
          bash securewave_app/ios/scripts/ensure_workspace.sh
          bash securewave_app/scripts/verify_ios_build.sh
      - name: Build iOS (no codesign via workspace)
        if: steps.ios_secrets.outputs.enabled == 'true'
        run: |
          cd securewave_app
          flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        if: steps.ios_secrets.outputs.enabled == 'true'
        with:
          name: securewave-ios
          path: securewave_app/build/ios/iphoneos/
