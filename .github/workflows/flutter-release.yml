name: Linux Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run release preflight checks
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          AUTH_ENCRYPTION_KEY: ${{ secrets.AUTH_ENCRYPTION_KEY }}
          WG_ENCRYPTION_KEY: ${{ secrets.WG_ENCRYPTION_KEY }}
          DEMO_MODE: "false"
          WG_MOCK_MODE: "false"
          PAYMENTS_MOCK: "false"
          DEMO_BILLING: "false"
          PAYMENT_PROVIDER: "stripe"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_PORTAL_CONFIG_ID: ${{ secrets.STRIPE_PORTAL_CONFIG_ID }}
          STRIPE_PRICE_BASIC_MONTHLY: ${{ secrets.STRIPE_PRICE_BASIC_MONTHLY }}
          STRIPE_PRICE_BASIC_YEARLY: ${{ secrets.STRIPE_PRICE_BASIC_YEARLY }}
          STRIPE_PRICE_PREMIUM_MONTHLY: ${{ secrets.STRIPE_PRICE_PREMIUM_MONTHLY }}
          STRIPE_PRICE_PREMIUM_YEARLY: ${{ secrets.STRIPE_PRICE_PREMIUM_YEARLY }}
          STRIPE_PRICE_ULTRA_MONTHLY: ${{ secrets.STRIPE_PRICE_ULTRA_MONTHLY }}
          STRIPE_PRICE_ULTRA_YEARLY: ${{ secrets.STRIPE_PRICE_ULTRA_YEARLY }}
        run: bash scripts/release_preflight.sh

  package-linux:
    name: Package Linux Desktop
    runs-on: ubuntu-latest
    needs: release-preflight
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev wireguard-tools dpkg-dev python3-pip
          python3 -m pip install --user appimage-builder
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare Flutter env asset
        run: FORCE_FLUTTER_ENV=true bash scripts/prepare_flutter_env.sh

      - name: Build Linux packages
        run: |
          bash securewave_app/scripts/build_appimage.sh
          bash securewave_app/scripts/build_deb.sh

      - name: Generate checksums
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find securewave_app -maxdepth 4 \( -name '*.AppImage' -o -path 'securewave_app/build/packaging/*.deb' \) -type f -print0 |
            while IFS= read -r -d '' artifact; do
              cp "$artifact" release-artifacts/
            done
          cd release-artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securewave-linux-packages-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
