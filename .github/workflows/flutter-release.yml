name: Flutter Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FLUTTER_CHANNEL: "stable"

jobs:
  package-linux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev python3-pip
      - name: Install appimage-builder
        run: |
          python3 -m pip install --user appimage-builder
          echo \"$HOME/.local/bin\" >> $GITHUB_PATH
      - name: Build Linux packages
        run: |
          bash securewave_app/scripts/build_appimage.sh
          bash securewave_app/scripts/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-linux-packages
          path: |
            securewave_app/SecureWave-x86_64.AppImage
            securewave_app/build/packaging/*.deb

  build-windows-installer:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          ./securewave_app/scripts/build_windows_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-windows-installer
          path: securewave_app/build/installer/*.exe

  build-macos:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Build macOS (unsigned)
        run: |
          cd securewave_app
          flutter pub get
          flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-macos
          path: securewave_app/build/macos/Build/Products/Release/

  build-android-aab:
    runs-on: ubuntu-latest
    if: secrets.ANDROID_KEYSTORE_BASE64 != '' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Decode keystore
        run: |
          echo \"${{ secrets.ANDROID_KEYSTORE_BASE64 }}\" | base64 -d > securewave_app/android/app/keystore.jks
      - name: Build Android AAB (release)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/securewave_app/android/app/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd securewave_app
          flutter pub get
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-android-aab
          path: securewave_app/build/app/outputs/bundle/release/*.aab

  build-ios:
    runs-on: macos-latest
    if: secrets.APPLE_TEAM_ID != '' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install CocoaPods
        run: |
          cd securewave_app
          flutter pub get
          cd ios && pod install --repo-update
      - name: Verify workspace
        run: |
          bash securewave_app/ios/scripts/ensure_workspace.sh
          bash securewave_app/scripts/verify_ios_build.sh
      - name: Build iOS (no codesign via workspace)
        run: |
          cd securewave_app
          flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-ios
          path: securewave_app/build/ios/iphoneos/
