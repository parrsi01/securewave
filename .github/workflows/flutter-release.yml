name: Flutter Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FLUTTER_CHANNEL: "stable"

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version sync
        run: bash scripts/verify_version_sync.sh
      - name: Release preflight checks
        # Guard against misconfigured release tags and missing production secrets.
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          AUTH_ENCRYPTION_KEY: ${{ secrets.AUTH_ENCRYPTION_KEY }}
          WG_ENCRYPTION_KEY: ${{ secrets.WG_ENCRYPTION_KEY }}
        run: bash scripts/release_preflight.sh

  package-linux:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Verify version sync
        run: bash scripts/verify_version_sync.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev python3-pip
      - name: Install appimage-builder
        run: |
          python3 -m pip install --user appimage-builder
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Build Linux packages
        run: |
          bash securewave_app/scripts/build_appimage.sh
          bash securewave_app/scripts/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-linux-packages
          path: |
            securewave_app/SecureWave-x86_64.AppImage
            securewave_app/build/packaging/*.deb

  build-windows-installer:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Verify version sync
        run: bash scripts/verify_version_sync.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          ./windows_installer/build_windows_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-windows-installer
          path: artifacts/windows_release/securewave-windows-x64-setup.exe

  build-macos:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Verify version sync
        run: bash scripts/verify_version_sync.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Build macOS (unsigned)
        run: |
          bash securewave_app/scripts/build_macos_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-macos
          path: securewave_app/build/macos/Build/Products/Release/

  build-android-aab:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Verify version sync
        run: bash scripts/verify_version_sync.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > securewave_app/android/app/keystore.jks
      - name: Build Android AAB (release)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/securewave_app/android/app/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd securewave_app
          flutter pub get
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-android-aab
          path: securewave_app/build/app/outputs/bundle/release/*.aab

  build-ios:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Verify version sync
        run: bash scripts/verify_version_sync.sh
      - name: Verify iOS store compliance
        # Guard against App Store blockers before running Xcode builds.
        run: bash scripts/verify_ios_store_compliance.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install CocoaPods
        run: |
          cd securewave_app
          flutter pub get
          cd ios && pod install --repo-update
      - name: Verify workspace
        run: |
          bash securewave_app/ios/scripts/ensure_workspace.sh
          bash securewave_app/scripts/verify_ios_build.sh
      - name: Build iOS (no codesign via workspace)
        run: |
          cd securewave_app
          flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: securewave-ios
          path: securewave_app/build/ios/iphoneos/
