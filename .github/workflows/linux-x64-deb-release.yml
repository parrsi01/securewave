name: Linux x64 Deb Build Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-x64-deb-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable
  EVIDENCE_DIR: artifacts/linux-x64-deb
  DEB_OUTPUT: artifacts/linux-x64-deb/securewave-linux-x64.deb

jobs:
  build-linux-x64-deb:
    name: Build Linux x64 .deb Evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Assert x86_64 Ubuntu runner
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          uname -m | tee "$EVIDENCE_DIR/architecture.txt"
          dpkg --print-architecture | tee "$EVIDENCE_DIR/dpkg-architecture.txt"
          test "$(uname -m)" = "x86_64"
          test "$(dpkg --print-architecture)" = "amd64"

      - name: Install Linux build and runtime dependency set
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            unzip \
            xz-utils \
            zip \
            ca-certificates \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            clang \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            dpkg-dev \
            dpkg \
            python3-pip \
            python3-venv \
            wireguard-tools \
            openvpn \
            network-manager \
            network-manager-strongswan \
            strongswan \
            strongswan-swanctl \
            strongswan-charon \
            libcharon-extra-plugins \
            libstrongswan-extra-plugins \
            iproute2 \
            iptables \
            acl

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show Flutter environment
        run: |
          set -euo pipefail
          flutter --version | tee "$EVIDENCE_DIR/flutter-version.txt"
          flutter doctor -v | tee "$EVIDENCE_DIR/flutter-doctor.txt"

      - name: Prepare Flutter env asset
        run: FORCE_FLUTTER_ENV=true bash scripts/prepare_flutter_env.sh

      - name: Build Linux x64 deb
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cd securewave_app
          flutter pub get
          bash scripts/build_deb.sh 2>&1 | tee "../$EVIDENCE_DIR/build-deb.log"

      - name: Collect generated deb
        run: |
          set -euo pipefail
          deb_path="$(find securewave_app/build/packaging -maxdepth 1 -type f -name '*.deb' | sort | tail -n 1)"
          if [ -z "$deb_path" ]; then
            echo "No .deb found under securewave_app/build/packaging" >&2
            exit 1
          fi
          printf '%s\n' "$deb_path" | tee "$EVIDENCE_DIR/generated-deb-path.txt"
          cp "$deb_path" "$DEB_OUTPUT"
          test "$(dpkg-deb --field "$DEB_OUTPUT" Architecture)" = "amd64"
          extract_dir="$(mktemp -d)"
          dpkg-deb --extract "$DEB_OUTPUT" "$extract_dir"
          file "$extract_dir/usr/lib/securewave/securewave_app" | tee "$EVIDENCE_DIR/application-architecture.txt"
          grep -Eq 'ELF 64-bit.*x86-64' "$EVIDENCE_DIR/application-architecture.txt"
          rm -rf "$extract_dir"
          du -h "$DEB_OUTPUT" | tee "$EVIDENCE_DIR/package-size.txt"
          sha256sum "$DEB_OUTPUT" | tee "$EVIDENCE_DIR/securewave-linux-x64.deb.sha256"
          file "$DEB_OUTPUT" | tee "$EVIDENCE_DIR/package-file.txt"
          dpkg-deb --info "$DEB_OUTPUT" | tee "$EVIDENCE_DIR/package-info.txt"
          dpkg-deb --contents "$DEB_OUTPUT" | tee "$EVIDENCE_DIR/package-contents.txt"

      - name: Build and verify portable x64 tarball evidence
        run: |
          set -euo pipefail
          bundle="securewave_app/build/linux/x64/release/bundle"
          test -d "$bundle"
          staging="$(mktemp -d)"
          cp -a "$bundle/." "$staging/"
          rm -rf "$staging/packaging/linux" "$staging/scripts/install_linux_helper.sh"
          file "$staging/securewave_app" | tee "$EVIDENCE_DIR/portable-application-architecture.txt"
          grep -Eq 'ELF 64-bit.*x86-64' "$EVIDENCE_DIR/portable-application-architecture.txt"
          tarball="$EVIDENCE_DIR/securewave-linux-x64.tar.gz"
          tar -czf "$tarball" -C "$staging" .
          verify="$(mktemp -d)"
          tar -xzf "$tarball" -C "$verify"
          file "$verify/securewave_app" | tee "$EVIDENCE_DIR/portable-tarball-architecture.txt"
          grep -Eq 'ELF 64-bit.*x86-64' "$EVIDENCE_DIR/portable-tarball-architecture.txt"
          sha256sum "$tarball" | tee "$EVIDENCE_DIR/securewave-linux-x64.tar.gz.sha256"
          rm -rf "$staging" "$verify"

      - name: Verify helper payload and dependency metadata
        run: |
          set -euo pipefail
          contents="$EVIDENCE_DIR/package-contents.txt"
          depends="$(dpkg-deb --field "$DEB_OUTPUT" Depends)"
          suggests="$(dpkg-deb --field "$DEB_OUTPUT" Suggests)"
          printf '%s\n' "$depends" | tee "$EVIDENCE_DIR/package-depends.txt"
          printf '%s\n' "$suggests" | tee "$EVIDENCE_DIR/package-suggests.txt"

          for payload in \
            "usr/lib/securewave/securewave_app" \
            "usr/share/applications/securewave-vpn.desktop" \
            "usr/share/securewave/packaging/linux/securewave-helperd" \
            "usr/share/securewave/packaging/linux/securewave-wg-quick" \
            "usr/share/securewave/packaging/linux/securewave-wg-quick.contract" \
            "usr/share/securewave/packaging/linux/securewave-helper.service" \
            "usr/share/securewave/packaging/linux/securewave-helper.tmpfiles" \
            "usr/lib/tmpfiles.d/securewave-helper.conf"
          do
            grep -F "$payload" "$contents" >/dev/null
            printf 'payload-ok %s\n' "$payload"
          done | tee "$EVIDENCE_DIR/helper-payload-checks.txt"

          for package in \
            wireguard-tools \
            openvpn \
            network-manager \
            libgtk-3-0 \
            libsecret-1-0 \
            libegl1 \
            iproute2 \
            iptables \
            acl \
            systemd
          do
            printf '%s\n' "$depends" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -Fx "$package" >/dev/null
            printf 'depends-ok %s\n' "$package"
          done | tee "$EVIDENCE_DIR/package-requirements-check.txt"

          for package in \
            network-manager-strongswan \
            strongswan \
            strongswan-swanctl \
            strongswan-charon \
            libcharon-extra-plugins \
            libstrongswan-extra-plugins
          do
            printf '%s\n' "$suggests" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -Fx "$package" >/dev/null
            printf 'suggests-ok %s\n' "$package"
          done | tee "$EVIDENCE_DIR/package-suggestions-check.txt"

      - name: Check manifest syntax and status
        run: |
          set -euo pipefail
          python3 -m json.tool static/downloads/manifest.json | tee "$EVIDENCE_DIR/manifest-json-check.txt" >/dev/null
          python3 - <<'PY' | tee "artifacts/linux-x64-deb/manifest-x64-status.txt"
          import json
          from pathlib import Path

          manifest = json.loads(Path("static/downloads/manifest.json").read_text())
          deb = next(
              item for item in manifest["downloads"]
              if item["platform"] == "linux"
              and item["architecture"] == "x64"
              and item["filename"] == "securewave-linux-x64.deb"
          )
          if deb["status"] != "coming_soon":
              raise SystemExit(
                  f"linux x64 deb status must stay coming_soon, got {deb['status']!r}"
              )
          print("linux-x64-deb-status=coming_soon")
          PY

      - name: Run downloads manifest unit test when dependencies are available
        run: |
          set -euo pipefail
          python3 -m venv .venv-manifest-tests
          . .venv-manifest-tests/bin/activate
          if ! {
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt pytest==9.0.3
          } > "$EVIDENCE_DIR/manifest-test-dependency-install.log" 2>&1; then
            {
              echo "blocked"
              echo "Reason: Python dependencies for tests/unit/test_downloads_manifest.py were unavailable."
            } | tee "$EVIDENCE_DIR/downloads-manifest-tests.blocked.txt"
            exit 0
          fi
          python -m pytest tests/unit/test_downloads_manifest.py -q 2>&1 | tee "$EVIDENCE_DIR/downloads-manifest-tests.txt"

      - name: Write evidence summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "# Linux x64 Deb Build Evidence"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Ref: $GITHUB_REF"
            echo "- SHA: $GITHUB_SHA"
            echo "- Runner architecture: $(cat "$EVIDENCE_DIR/architecture.txt" 2>/dev/null || echo unknown)"
            echo "- Dpkg architecture: $(cat "$EVIDENCE_DIR/dpkg-architecture.txt" 2>/dev/null || echo unknown)"
            echo "- Artifact path: $DEB_OUTPUT"
            if [ -f "$EVIDENCE_DIR/package-size.txt" ]; then
              echo "- Package size: $(cat "$EVIDENCE_DIR/package-size.txt")"
            fi
            if [ -f "$EVIDENCE_DIR/securewave-linux-x64.deb.sha256" ]; then
              echo "- SHA256: $(cat "$EVIDENCE_DIR/securewave-linux-x64.deb.sha256")"
            fi
            echo
            echo "This evidence proves an x86_64 GitHub-hosted Ubuntu runner built a Debian package and that the package metadata contains the helper payload and declared runtime dependencies. It does not prove clean-VM install, systemd helper startup, socket creation, or live WireGuard/OpenVPN/IKEv2 routing."
          } | tee "$EVIDENCE_DIR/README.md"

      - name: Upload x64 deb and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: securewave-linux-x64-deb-evidence-${{ github.run_number }}
          path: artifacts/linux-x64-deb/
          if-no-files-found: error
          retention-days: 14
