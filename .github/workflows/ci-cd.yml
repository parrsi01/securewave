name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  FLUTTER_CHANNEL: stable

jobs:
  repo-guards:
    name: Repository Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Reject conflict-copy files
        run: |
          set -euo pipefail
          conflicts="$(find . -path ./.git -prune -o \( -name '* 2.*' -o -name '* 2' \) -print)"
          if [ -n "$conflicts" ]; then
            echo "ERROR: conflict-copy files detected. Clean these locally before committing:" >&2
            echo "$conflicts" >&2
            exit 1
          fi

      - name: Reject retired cloud references
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          terms = [
              "az" + "ure",
              "az" + "urewebsites",
              "application" + "insights",
              "opencensus.ext." + "az" + "ure",
              "key" + " vault",
          ]
          upper_terms = ["AZ" + "URE_"]
          failures = []
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for filename in files:
              if filename.startswith("securewave_app/ios/ThirdParty/"):
                  continue
              path = Path(filename)
              text = path.read_text(encoding="utf-8", errors="ignore")
              lowered = text.lower()
              if any(term in lowered for term in terms) or any(term in text for term in upper_terms):
                  failures.append(filename)
          if failures:
              print("ERROR: retired cloud references are not allowed in tracked files.", file=sys.stderr)
              for item in failures:
                  print(f" - {item}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify repository hygiene and redacted secret scan
        run: |
          python3 scripts/check_repository_hygiene.py
          python3 scripts/scan_repository_secrets.py

      - name: Verify tracked shell and JavaScript syntax
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 bash -n
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z '*.js')

      - name: Verify UI v1 assets
        run: bash scripts/verify_ui_v1.sh

      - name: Verify plan copy
        run: bash scripts/check_plan_copy.sh

      - name: Verify release guards
        run: bash scripts/verify_release_guards.sh

      - name: Verify Xcode workspace guardrails
        run: bash scripts/check_xcworkspace_usage.sh

  security:
    name: Dependency and Code Security
    runs-on: ubuntu-latest
    needs: repo-guards
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      - name: Install security scanners
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt --strict

      - name: Scan Python code for high-severity findings
        run: |
          python -m bandit -q -lll -r \
            main.py routes routers services models database scripts infrastructure

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: repo-guards
    services:
      postgres:
        image: postgres:15@sha256:bcab099bfaab33333a73a2ebe8c1d615c9f4c2402dd43452f989a36c6da9a5ba
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_securewave
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_securewave
      SECUREWAVE_TEST_POSTGRES_URL: postgresql://test_user:test_password@localhost:5432/test_securewave
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci
      ACCESS_TOKEN_SECRET: test-access-token-secret
      REFRESH_TOKEN_SECRET: test-refresh-token-secret
      TESTING: "true"
      DEMO_MODE: "true"
      WG_MOCK_MODE: "true"
      ENABLE_SENTRY: "false"
      EMAIL_VALIDATOR_CHECK_DELIVERABILITY: "false"
      BCRYPT_ROUNDS: "4"
      AUTO_CREATE_TABLES: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_ml.txt
            requirements_dev.txt

      - name: Install Linux helper test build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libglib2.0-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Apply and verify Alembic schema
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              conn.execute(text("DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;"))
              conn.commit()
          PY
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic upgrade head
          python -m alembic check
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          import os

          tables = set(inspect(create_engine(os.environ["DATABASE_URL"])).get_table_names())
          required = {"users", "vpn_servers", "vpn_connections", "vpn_usage_events", "invoices"}
          missing = required - tables
          if missing:
              raise SystemExit(f"Migration verification missing tables: {sorted(missing)}")
          print("Alembic migration verification passed")
          PY

      - name: Compile backend modules
        run: |
          python -m compileall -q main.py database models routes routers services utils alembic tests
          python -m ruff check --select E9,F63,F7,F82 main.py database models routes routers services utils alembic tests

      - name: Run pytest
        run: |
          SKIP_INSTALL=true \
          USE_SYSTEM_PYTHON=true \
          PYTEST_ARGS="tests -v --cov=. --cov-report=xml" \
            bash scripts/run_backend_tests.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  flutter-linux:
    name: Flutter Linux Analyze and Build
    runs-on: ubuntu-latest
    needs: repo-guards
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev wireguard-tools

      - name: Prepare Flutter env asset
        run: FORCE_FLUTTER_ENV=true bash scripts/prepare_flutter_env.sh

      - name: Flutter analyze
        run: |
          cd securewave_app
          flutter pub get
          flutter analyze

      - name: Flutter tests
        run: |
          cd securewave_app
          flutter test

      - name: Flutter Linux release build
        run: |
          cd securewave_app
          flutter build linux --release

  flutter-android:
    name: Flutter Android Debug Build
    runs-on: ubuntu-latest
    needs: repo-guards
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Prepare Flutter env asset
        run: FORCE_FLUTTER_ENV=true bash scripts/prepare_flutter_env.sh

      - name: Build Android debug APK as compile evidence
        run: |
          cd securewave_app
          flutter pub get
          flutter build apk --debug

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [repo-guards, python-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: securewave:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
