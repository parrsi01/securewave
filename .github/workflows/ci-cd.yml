name: CI

on:
  push:
    branches: [ "main", "master", "release/**" ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Keep full history available for manual audits.

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks dir --redact --no-banner -c .gitleaks.toml .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Install Nginx (for preview proxy tests)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nginx

      - name: Cost guardrails
        run: bash scripts/check_cost_guardrails.sh

      - name: Legal placeholder guard
        run: bash scripts/check_legal_placeholders.sh

      - name: Run tests
        run: |
          mkdir -p artifacts/test-results
          pytest -q --junitxml=artifacts/test-results/pytest.xml

      - name: Publish pytest report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pytest
          path: artifacts/test-results/pytest*.xml
          reporter: java-junit

      - name: Run chaos suite
        run: bash dev_tools/sandbox/chaos_tests/run_chaos_suite.sh --strict

      - name: Run benchmark suite
        run: bash dev_tools/sandbox/benchmark/run_benchmarks.sh --strict

      - name: Run leak suite
        run: bash dev_tools/sandbox/leak_tests/run_leak_tests.sh --strict

      - name: Generate validation master report
        run: python scripts/generate_validation_master_report.py

      - name: Generate launch orchestrator reports
        run: python scripts/generate_launch_orchestrator_reports.py

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-artifacts
          path: |
            artifacts/test-results
            artifacts/chaos_tests
            artifacts/benchmark
            artifacts/leak_tests
            artifacts/validation_master_report.md
            artifacts/launch_orchestrator_summary.md
            artifacts/launch_alert_matrix.md
            artifacts/operator_playbooks_index.md
            artifacts/canary_report.md
            monitoring/grafana

  flutter-state-machine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securewave_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter state-machine suite
        run: flutter test test/state_machine

      - name: Flutter integration suite
        run: flutter test integration_test

  flutter-state-stress:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Run VPN state stress harness
        run: bash dev_tools/sandbox/state_stress/run_stress_flows.sh

      - name: Upload state stress artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-stress-artifacts
          path: |
            artifacts/state_stress

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: [ checks ]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy backend
        env:
          VPS_HOST: ${{ secrets.HETZNER_HOST }}
          VPS_USER: ${{ secrets.HETZNER_SSH_USER }}
          SSH_KEY_PATH: ~/.ssh/deploy_key
        run: bash scripts/ops/hetzner_deploy.sh

      - name: Verify deployment
        run: |
          sleep 5
          STATUS=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.HETZNER_SSH_USER }}@${{ secrets.HETZNER_HOST }}" \
            'curl -sf http://127.0.0.1:8080/api/health | python3 -c "import sys,json; print(json.load(sys.stdin).get(\"status\",\"fail\"))"')
          if [ "$STATUS" != "ok" ]; then
            echo "Health check failed after deploy: $STATUS"
            exit 1
          fi
          echo "Deployment verified: health=$STATUS"
