name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  FLUTTER_CHANNEL: stable

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      client: ${{ steps.classify.outputs.client }}
      website: ${{ steps.classify.outputs.website }}
      security: ${{ steps.classify.outputs.security }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Classify paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            files="__all__"
          else
            base="$BASE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$BEFORE_SHA"
            fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^)"
            fi
            files="$(git diff --name-only "$base" HEAD)"
          fi
          classify() {
            local expression="$1"
            if [[ "$files" == "__all__" ]] || grep -Eq "$expression" <<<"$files"; then
              echo true
            else
              echo false
            fi
          }
          {
            echo "backend=$(classify '^(main\.py|routes/|routers/|services/|models/|database/|utils/|alembic/|requirements.*\.txt|Dockerfile|deploy/|infrastructure/|scripts/deploy_)')"
            echo "client=$(classify '^(securewave_app/|scripts/(build_apps|prepare_flutter_env|run_flutter_linux)\.sh)')"
            echo "website=$(classify '^(static/|templates/|scripts/verify_website\.sh)')"
            echo "security=$(classify '^(requirements.*\.txt|main\.py|routes/|routers/|services/|models/|database/|utils/|infrastructure/)')"
          } >> "$GITHUB_OUTPUT"

  repo-guards:
    name: Repository Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Reject conflict-copy files
        run: |
          set -euo pipefail
          conflicts="$(find . -path ./.git -prune -o \( -name '* 2.*' -o -name '* 2' \) -print)"
          if [ -n "$conflicts" ]; then
            echo "ERROR: conflict-copy files detected. Clean these locally before committing:" >&2
            echo "$conflicts" >&2
            exit 1
          fi

      - name: Reject retired cloud references
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          terms = [
              "az" + "ure",
              "az" + "urewebsites",
              "application" + "insights",
              "opencensus.ext." + "az" + "ure",
              "key" + " vault",
          ]
          upper_terms = ["AZ" + "URE_"]
          failures = []
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for filename in files:
              if filename.startswith("securewave_app/ios/ThirdParty/"):
                  continue
              path = Path(filename)
              text = path.read_text(encoding="utf-8", errors="ignore")
              lowered = text.lower()
              if any(term in lowered for term in terms) or any(term in text for term in upper_terms):
                  failures.append(filename)
          if failures:
              print("ERROR: retired cloud references are not allowed in tracked files.", file=sys.stderr)
              for item in failures:
                  print(f" - {item}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify repository hygiene and redacted secret scan
        run: |
          python3 scripts/check_repository_hygiene.py
          python3 scripts/scan_repository_secrets.py

      - name: Install pinned workflow linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          export GOBIN="$RUNNER_TEMP/actionlint-bin"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Verify tracked shell, JavaScript, and Actions syntax
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 bash -n
          git ls-files -z '*.sh' | xargs -0 shellcheck -x
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z '*.js')
          actionlint

      - name: Verify UI v1 assets
        run: bash scripts/verify_ui_v1.sh

      - name: Verify plan copy
        run: bash scripts/check_plan_copy.sh

      - name: Verify release guards
        run: bash scripts/verify_release_guards.sh

      - name: Verify Xcode workspace guardrails
        run: bash scripts/check_xcworkspace_usage.sh

  security:
    name: Dependency and Code Security
    runs-on: ubuntu-latest
    needs: [changes, repo-guards]
    if: needs.changes.outputs.security == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      - name: Install security scanners
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt --strict

      - name: Scan Python code for high-severity findings
        run: |
          python -m bandit -q -lll -r \
            main.py routes routers services models database scripts infrastructure

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: [changes, repo-guards]
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:15@sha256:bcab099bfaab33333a73a2ebe8c1d615c9f4c2402dd43452f989a36c6da9a5ba
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_securewave
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_securewave
      SECUREWAVE_TEST_POSTGRES_URL: postgresql://test_user:test_password@localhost:5432/test_securewave
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci
      ACCESS_TOKEN_SECRET: test-access-token-secret
      REFRESH_TOKEN_SECRET: test-refresh-token-secret
      TESTING: "true"
      DEMO_MODE: "true"
      WG_MOCK_MODE: "true"
      ENABLE_SENTRY: "false"
      EMAIL_VALIDATOR_CHECK_DELIVERABILITY: "false"
      BCRYPT_ROUNDS: "4"
      AUTO_CREATE_TABLES: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_ml.txt
            requirements_dev.txt

      - name: Install Linux helper test build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libglib2.0-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Verify native production dependency set
        run: |
          python -m venv "$RUNNER_TEMP/securewave-production-venv"
          "$RUNNER_TEMP/securewave-production-venv/bin/pip" install \
            --disable-pip-version-check -r requirements_production.txt
          TESTING=true AUTO_CREATE_TABLES=false DEMO_MODE=true WG_MOCK_MODE=true \
            "$RUNNER_TEMP/securewave-production-venv/bin/python" -c "import main"

      - name: Apply and verify Alembic schema
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              conn.execute(text("DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;"))
              conn.commit()
          PY
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic upgrade head
          python -m alembic check
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          import os

          tables = set(inspect(create_engine(os.environ["DATABASE_URL"])).get_table_names())
          required = {"users", "vpn_servers", "vpn_connections", "vpn_usage_events", "invoices"}
          missing = required - tables
          if missing:
              raise SystemExit(f"Migration verification missing tables: {sorted(missing)}")
          print("Alembic migration verification passed")
          PY

      - name: Compile backend modules
        run: |
          python -m compileall -q main.py database models routes routers services utils alembic tests
          python -m ruff check --select E9,F63,F7,F82 main.py database models routes routers services utils alembic tests

      - name: Run pytest
        run: |
          SKIP_INSTALL=true \
          USE_SYSTEM_PYTHON=true \
          PYTEST_ARGS="tests -v --cov=. --cov-report=xml" \
            bash scripts/run_backend_tests.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  flutter-linux:
    name: Flutter Linux Analyze and Build
    runs-on: ubuntu-latest
    needs: [changes, repo-guards]
    if: needs.changes.outputs.client == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev wireguard-tools

      - name: Prepare Flutter env asset
        run: FORCE_FLUTTER_ENV=true bash scripts/prepare_flutter_env.sh

      - name: Flutter analyze
        run: |
          cd securewave_app
          flutter pub get
          flutter analyze

      - name: Flutter tests
        run: |
          cd securewave_app
          flutter test

      - name: Flutter Linux release build
        run: |
          cd securewave_app
          flutter build linux --release

  flutter-android:
    name: Flutter Android Debug Build
    runs-on: ubuntu-latest
    needs: [changes, repo-guards]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Prepare Flutter env asset
        run: FORCE_FLUTTER_ENV=true bash scripts/prepare_flutter_env.sh

      - name: Build Android debug APK as compile evidence
        run: |
          cd securewave_app
          flutter pub get
          flutter build apk --debug

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [changes, repo-guards, python-tests]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: securewave:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  website:
    name: Website Contract
    runs-on: ubuntu-latest
    needs: [changes, repo-guards]
    if: needs.changes.outputs.website == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify website and download metadata
        run: |
          python3 -m json.tool static/downloads/manifest.json >/dev/null
          bash scripts/verify_website.sh

  deploy-gate:
    name: Verified Change Set
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - repo-guards
      - security
      - python-tests
      - flutter-linux
      - flutter-android
      - docker-build
      - website
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          if grep -Eq '(^| )(failure|cancelled)($| )' <<<"$RESULTS"; then
            echo "One or more selected CI jobs failed or were cancelled." >&2
            exit 1
          fi
          echo "All selected CI jobs passed or were intentionally skipped."
