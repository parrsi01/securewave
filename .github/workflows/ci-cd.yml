name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  FLUTTER_CHANNEL: stable

jobs:
  repo-guards:
    name: Repository Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject conflict-copy files
        run: |
          set -euo pipefail
          conflicts="$(find . -path ./.git -prune -o \( -name '* 2.*' -o -name '* 2' \) -print)"
          if [ -n "$conflicts" ]; then
            echo "ERROR: conflict-copy files detected. Clean these locally before committing:" >&2
            echo "$conflicts" >&2
            exit 1
          fi

      - name: Reject retired cloud GitHub Actions configuration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys

          retired_provider = "az" + "ure"
          failures = []
          for path in Path(".github/workflows").glob("*.yml"):
              text = path.read_text(encoding="utf-8")
              lowered = text.lower()
              if retired_provider in lowered or "AZ" + "URE_" in text:
                  failures.append(str(path))
          if failures:
              print("ERROR: retired cloud CI/CD references are not allowed in GitHub Actions.", file=sys.stderr)
              for item in failures:
                  print(f" - {item}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify UI v1 assets
        run: bash scripts/verify_ui_v1.sh

      - name: Verify plan copy
        run: bash scripts/check_plan_copy.sh

      - name: Verify release guards
        run: bash scripts/verify_release_guards.sh

      - name: Verify Xcode workspace guardrails
        run: bash scripts/check_xcworkspace_usage.sh

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: repo-guards
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_securewave
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_securewave
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci
      ACCESS_TOKEN_SECRET: test-access-token-secret
      REFRESH_TOKEN_SECRET: test-refresh-token-secret
      TESTING: "true"
      DEMO_MODE: "true"
      WG_MOCK_MODE: "true"
      ENABLE_APP_INSIGHTS: "false"
      ENABLE_SENTRY: "false"
      EMAIL_VALIDATOR_CHECK_DELIVERABILITY: "false"
      BCRYPT_ROUNDS: "4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_ml.txt
            requirements_dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Prepare test database
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              conn.execute(text("DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;"))
              conn.commit()
          PY
          python - <<'PY'
          from database.base import Base
          from database.session import engine

          Base.metadata.create_all(bind=engine)
          PY
          python -m alembic stamp head

      - name: Run pytest
        run: |
          SKIP_INSTALL=true \
          USE_SYSTEM_PYTHON=true \
          PYTEST_ARGS="tests -v --cov=. --cov-report=xml" \
            bash scripts/run_backend_tests.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  flutter-linux:
    name: Flutter Linux Analyze and Build
    runs-on: ubuntu-latest
    needs: repo-guards
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev wireguard-tools

      - name: Prepare Flutter env asset
        run: FORCE_FLUTTER_ENV=true bash scripts/prepare_flutter_env.sh

      - name: Flutter analyze
        run: |
          cd securewave_app
          flutter pub get
          flutter analyze

      - name: Flutter tests
        run: |
          cd securewave_app
          flutter test

      - name: Flutter Linux release build
        run: |
          cd securewave_app
          flutter build linux --release

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [repo-guards, python-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: securewave:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
