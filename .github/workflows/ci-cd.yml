name: CI

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Keep full history available for manual audits.

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks dir --redact --no-banner -c .gitleaks.toml .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cost guardrails
        run: bash scripts/check_cost_guardrails.sh

      - name: Run tests
        run: python -m pytest -q
