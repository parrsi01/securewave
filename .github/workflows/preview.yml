name: preview-site

on:
  push:
    branches:
      - "preview/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static preview artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/preview_site
          cp -a static/. artifacts/preview_site/

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: securewave-preview-site
          path: artifacts/preview_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/preview_site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
