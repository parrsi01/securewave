name: SecureWave Linux Beta

on:
  push:
    branches: [master, demo]
  pull_request:
    branches: [master, demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Linux Beta
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: master
          flutter-version: "3.41.4"
          architecture: arm64
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev wireguard-tools iproute2 iptables dpkg-dev

      - name: Install Python dependencies
        run: python -m pip install -r requirements_dev.txt

      - name: Run beta suite
        run: ./scripts/test_linux_beta.sh

      - name: Build and verify ARM64 package
        run: |
          ./scripts/build_linux_deb.sh
          ./scripts/verify_linux_deb.sh securewave_app/build/packaging/*.deb
