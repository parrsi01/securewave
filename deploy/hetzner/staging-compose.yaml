services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securewave_staging}
      POSTGRES_USER: ${POSTGRES_USER:-securewave_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - securewave-staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-securewave_staging} -d ${POSTGRES_DB:-securewave_staging}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - securewave-staging-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${SECUREWAVE_STAGING_IMAGE:?SECUREWAVE_STAGING_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${SECUREWAVE_STAGING_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: staging
      PORT: "8080"
      DEMO_MODE: "false"
      WG_MOCK_MODE: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-securewave_staging}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-securewave_staging}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - securewave-staging-data:/app/data
      - securewave-staging-wg:/wg
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  securewave-staging-postgres:
  securewave-staging-redis:
  securewave-staging-data:
  securewave-staging-wg:
