services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securewave}
      POSTGRES_USER: ${POSTGRES_USER:-securewave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - securewave-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securewave} -d ${POSTGRES_DB:-securewave}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${SECUREWAVE_IMAGE:?SECUREWAVE_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${SECUREWAVE_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      PORT: "8080"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-securewave}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-securewave}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  securewave-postgres:
