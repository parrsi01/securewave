# SecureWave owns only NetworkManager's client daemon settings. System charon is
# intentionally untouched. Table 210 isolates charon-nm routes from charon's
# conventional table 220. Mark 0xdc remains 220 for strongSwan 5.9.x ESP parity.
charon-nm {
    routing_table = 210
    routing_table_prio = 210
    plugins {
        kernel-netlink {
            fwmark = !0xdc
        }
        socket-default {
            fwmark = 0xdc
        }
    }
}
