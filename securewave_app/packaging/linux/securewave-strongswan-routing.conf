# SecureWave owns this drop-in. The matching packet and routing-rule marks are
# required together so IKE traffic cannot recursively enter strongSwan table 220.
charon {
    plugins {
        kernel-netlink {
            fwmark = !0xdc
        }
        socket-default {
            fwmark = 0xdc
        }
    }
}

charon-nm {
    plugins {
        kernel-netlink {
            fwmark = !0xdc
        }
        socket-default {
            fwmark = 0xdc
        }
    }
}
