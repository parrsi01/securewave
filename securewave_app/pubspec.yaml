name: securewave_app
version: 4.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  dio: 5.9.0
  flutter_dotenv: 5.2.1
  flutter_secure_storage: 9.2.4
  go_router: 14.8.1
  intl: 0.19.0
  uuid: 4.5.2
  connectivity_plus: 6.1.5
  platform_info: 4.0.2
  path_provider: 2.1.5
  flutter_spinkit: 5.2.2
  flutter_svg: 2.2.3
  google_fonts: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 3.0.2
  flutter_launcher_icons: 0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
  linux:
    generate: true
