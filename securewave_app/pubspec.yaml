name: securewave_app
version: 4.0.0+3
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.10.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.3
  uuid: ^4.6.0
  connectivity_plus: ^6.0.3
  platform_info: ^4.0.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
  linux:
    generate: true
