# SecureWave Preview Nginx Config (Template)
#
# This file is a template. `setup_preview.sh` renders it into:
#   /etc/nginx/sites-available/securewave_preview.conf
#
# Placeholders:
# - __SERVER_NAME__   (e.g., 138.199.204.139.nip.io)
# - __UPSTREAM_HOST__ (default 127.0.0.1)
# - __UPSTREAM_PORT__ (default 8080)
# - __SSL_CERT__      (fullchain.pem path when SSL enabled)
# - __SSL_KEY__       (privkey.pem path when SSL enabled)
#
# Note: The SSL server block is wrapped in markers so setup can drop it when SSL is disabled.

upstream securewave_preview_upstream {
    server __UPSTREAM_HOST__:__UPSTREAM_PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # ACME challenge webroot (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/securewave_acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Everything else → HTTPS. Never proxy API over plaintext.
    location / {
        return 301 https://$host$request_uri;
    }
}

# SSL_BLOCK_BEGIN
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    client_max_body_size 10m;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Hide server version
    server_tokens off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://securewave_preview_upstream;
    }
}
# SSL_BLOCK_END

